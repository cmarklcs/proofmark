DEMO.reteach=`## Misconceptions that matter most
- **An example is treated as a proof** (Ben, Diego; Farah left both proofs blank). Students check a case instead of starting from definitions.
- **Partial distribution with a negative factor** (Ben, Gus, Diego). The last term of the trinomial is skipped or its sign flips.
- **Stopping before factoring completely** (Ben, Gus, Diego). x² − 4 is left unfactored.
## Reteach activity for every gap
- **Q1 Polynomial multiplication (HSA-APR.A.1):** Area-model race. Pairs fill a 2×3 box for (2x − 3)(x² + 4x − 1), circle every negative, then count 6 products before combining. Practice: (x − 2)(x² − 3x + 5) → x³ − 5x² + 11x − 10.
- **Q2 Polynomial division (HSA-APR.D.6):** Show long division beside synthetic division with the subtraction written as 'add the opposite'. Students check by multiplying back. Practice: (x³ + 2x² − 5x − 6) ÷ (x + 1) → x² + x − 6.
- **Q3 Factoring completely (HSA-SSE.A.2):** 'Can it break again?' card sort: 12 partly factored expressions; students sort into done / not done and finish the second pile. Practice: 3x³ − 27x → 3x(x − 3)(x + 3).
- **Q4 Zeros from factors (HSA-APR.B.3):** Link the remainder-0 result to a root on a graph in Desmos, then list one zero per factor. Practice: zeros of x³ − 7x + 6 → 1, 2, −3.
- **Q5–6 Proof logic (MP3):** 'Example or proof?' Show three arguments; students mark which prove the claim for every integer and why. Then fill a proof frame: Let… Then… So… Therefore…
## Small groups
- **Proof starters:** Ben, Diego, Farah
- **Negatives & distribution:** Ben, Gus, Diego
- **Polish & justify:** Amara, Emily, Hana, Chloé
## Warm-up problems
- Proof starters: Prove the sum of two even integers is even.
- Negatives & distribution: Expand −2(x² − 3x − 4) and (x − 1)(x² − x − 1).
- Polish & justify: Prove the product of two odd integers is odd, giving a reason for every line.`;

function keyText(a){return a.questions.map(q=>`Q${q.n} [${num(q.points)} pts] Concept: ${q.concept||"(unspecified)"}${q.standard?" | Standard: "+q.standard:""}\n  Question: ${q.prompt||"(see page)"}\n  Correct answer / what earns credit: ${q.answer||"(not given; solve it yourself)"}`).join("\n")}
function gradePrompt(a,split,pageCount){
  return `You are grading ONE student's handwritten math assessment for their teacher. The attached images are this student's ${pageCount} page(s), in order.${split?" Each page is sent as two overlapping crops (top part, then bottom part) so handwriting is legible; treat the overlap as the same work, not repeated work.":""}

ASSESSMENT: ${a.title}${a.course?" ("+a.course+")":""}
ANSWER KEY AND RUBRIC:
${keyText(a)}

TEACHER'S GRADING GUIDANCE: ${a.guidance||"Use standard partial credit."}

HOW TO GRADE
- Read all handwritten work for each question, including scratch work and crossed-out lines. Grade both the final answer and the reasoning.
- Award partial credit in steps of 0.5, never above the question's points. Follow the rubric and guidance.
- For every point lost, find the FIRST step where the work goes wrong and describe it precisely, quoting what the student wrote (e.g. "Line 2: distributed −3 to x² and 4x but not to −1").
- For proofs, check every inference: name a missing justification, an unjustified leap, an example used as proof, circular reasoning, or a proved converse.
- Never invent work that isn't on the page. If handwriting is hard to read, give your best reading and set confidence "low". If nothing is written for a question, status "blank".
- error_type must be one of: ${ERR_TYPES.map(t=>'"'+t+'"').join(", ")} ("none" when full credit).
- Read the student's name from the page if written; otherwise "".

FEEDBACK TO THE STUDENT (${a.level||"high school"} reading level): warm, specific, second person, about the math, never about the score. "glow" names something they really did well. "grow" names the ONE most important thing to work on. "next_steps" are 2–3 concrete actions or practice problems. "hint" shows the next correct move for their biggest error without doing the whole problem. Each item "comment" is one or two sentences to the student.

Reply with ONLY this JSON:
{"student_name":"","items":[{"q":"1","earned":0,"status":"correct|partial|incorrect|blank","student_answer":"short transcription of their final answer","error_type":"none","error_step":"teacher-facing: exact step where it went wrong, or empty","comment":"","confidence":"high|medium|low"}],"feedback":{"glow":"","grow":"","next_steps":[""],"hint":""}}
Include exactly one item for each question: ${a.questions.map(q=>q.n).join(", ")}.`;
}
function normalizeResult(a,r,fallbackName){
  const items=a.questions.map(q=>{const it=(r&&Array.isArray(r.items)?r.items:[]).find(x=>String(x.q).replace(/^Q/i,"")===String(q.n))||{};
    const max=num(q.points);let earned=Math.max(0,Math.min(max,Math.round(num(it.earned)*2)/2));
    const et=ERR_TYPES.includes(it.error_type)?it.error_type:(earned===max?"none":"procedural");
    return {q:q.n,max,earned,status:["correct","partial","incorrect","blank"].includes(it.status)?it.status:(earned===max?"correct":earned>0?"partial":"incorrect"),
      student_answer:String(it.student_answer||""),error_type:et,error_step:String(it.error_step||""),comment:String(it.comment||""),confidence:["high","medium","low"].includes(it.confidence)?it.confidence:"medium"}});
  const f=(r&&r.feedback)||{};
  return {name:String((r&&r.student_name)||"").trim()||fallbackName,items,
    feedback:{glow:String(f.glow||""),grow:String(f.grow||""),next_steps:Array.isArray(f.next_steps)?f.next_steps.map(String).filter(Boolean):[],hint:String(f.hint||"")}};
}

function loadPdf(){if(!pdfReady)pdfReady=new Promise((res,rej)=>{const go=()=>{if(window.pdfjsWorker)return res(window.pdfjsLib);const s=document.createElement("script");s.src=PDF_WORKER;s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDF_WORKER;res(window.pdfjsLib)};s.onerror=()=>rej(new Error("pdf worker"));document.head.appendChild(s)};
  if(window.pdfjsLib)go();else{let n=0;const t=setInterval(()=>{if(window.pdfjsLib){clearInterval(t);go()}else if(++n>100){clearInterval(t);rej(new Error("pdf lib"))}},100)}});return pdfReady}
const toBlob=(c,q=.86)=>new Promise(r=>c.toBlob(r,"image/jpeg",q));
async function fileToPages(file){
  if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)){
    const lib=await loadPdf();const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;const out=[];
    for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const v1=pg.getViewport({scale:1});const v=pg.getViewport({scale:Math.min(3,1800/v1.width)});
      const c=document.createElement("canvas");c.width=Math.round(v.width);c.height=Math.round(v.height);const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
      await pg.render({canvasContext:ctx,viewport:v}).promise;out.push({blob:await toBlob(c),label:file.name+" p"+i,w:c.width,h:c.height})}
    return out;
  }
  const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});const sc=Math.min(1,2400/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(bmp,0,0,c.width,c.height);
  return [{blob:await toBlob(c),label:file.name,w:c.width,h:c.height}];
}
async function splitPage(p){
  const img=await createImageBitmap(p.blob);const parts=[];
  for(const [a,b] of [[0,.56],[.44,1]]){const h=Math.round(img.height*(b-a));const c=document.createElement("canvas");c.width=img.width;c.height=h;c.getContext("2d").drawImage(img,0,Math.round(img.height*a),img.width,h,0,0,img.width,h);parts.push(await toBlob(c,.9))}
  return parts;
}

/* ---------- grading run ---------- */
async function gradeAll(){
  const a=S.cur;if(!a||a.demo||!S.sample)return;
  const todo=groups().filter(g=>!(S.pageMap[g.key]&&S.pageMap[g.key].status==="done"));
  if(!todo.length)return;
  const run={start:Date.now(),done:0,total:todo.length,errors:0,ctl:new AbortController(),stopped:false};S.grading=run;
  for(const g of todo)S.pageMap[g.key]={...(S.pageMap[g.key]||{}),status:"queued"};
  render();const tick=setInterval(()=>{if(S.tab==="grade")renderProgress()},1000);
  if(!a.questions.length){run.phase="key";renderProgress();
    const k=await buildKeyFromWork(todo[0].pages,run.ctl.signal);run.phase=null;
    if(!k.ok){clearInterval(tick);run.end=Date.now();if(k.code!=="cancelled")run.fatal=k.code&&k.code!=="invalid_json"?errCopy(k.code):"Couldn't read the questions from the first student's pages. Try a clearer scan, or type the questions on the Answer key tab.";
      for(const g of todo)S.pageMap[g.key].status="ready";render();return}
    toast(`Answer key built: ${a.questions.length} questions. Grading now.`);
  }
  const maxImgs=S.imgLimits?.maxCount||20;let next=0;
  async function worker(){
    while(next<todo.length&&!run.stopped){const g=todo[next++];const st=S.pageMap[g.key];st.status="grading";renderGroups();
      try{
        let imgs=g.pages.map(p=>p.blob),split=false;
        if(S.detail&&g.pages.length*2<=maxImgs){imgs=[];for(const p of g.pages)imgs.push(...await splitPage(p));split=true}
        const r=await S.sample.json(gradePrompt(a,split,g.pages.length),{images:imgs,modelTier:S.tier,signal:run.ctl.signal,cache:false});
        const fallback="Student "+(a.students.length+1);
        const res=normalizeResult(a,r,fallback);
        const existing=st.sid&&a.students.find(s=>s.id===st.sid);
        const stu=existing||{id:uid(),order:Date.now()+g.idx};
        Object.assign(stu,res,{gradedAt:Date.now(),pages:g.pages.length,pageKey:g.key});
        if(!existing)a.students.push(stu);
        st.status="done";st.sid=stu.id;saveStudent(stu);run.done++;
      }catch(e){
        if(e&&e.code==="cancelled"){st.status="queued";break}
        st.status="error";st.msg=errCopy(e&&e.code);run.errors++;run.done++;
        if(["not_granted","sampling_disabled","rate_limited","session_expired","images_unavailable","not_declared","capability_disabled"].includes(e&&e.code)){run.stopped=true;run.fatal=errCopy(e.code)}
      }
      renderGroups();renderProgress();
    }
  }
  await Promise.all([worker(),worker()]);
  clearInterval(tick);run.end=Date.now();
  for(const g of todo){if(S.pageMap[g.key].status==="queued"||S.pageMap[g.key].status==="grading")S.pageMap[g.key].status="ready"}
  render();
  if(!run.fatal&&!run.ctl.signal.aborted)toast(`Graded ${run.done-run.errors} of ${run.total} in ${mins(run.end-run.start)}`);
}
function mins(ms){const s=Math.round(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}

async function buildKeyFromWork(pages,signal){

  try{
    const maxImgs=S.imgLimits?.maxCount||20;let imgs=pages.map(p=>p.blob);
    if(pages.length*2<=maxImgs){imgs=[];for(const p of pages)imgs.push(...await splitPage(p))}
    const r=await S.sample.json(`These images are one student's completed math assessment (each page may be sent as two overlapping crops, top then bottom). The teacher has NOT given an answer key. Your job is to build the grading key from the printed questions.
- Find every question printed on the pages, even ones the student skipped. Ignore the student's handwritten answers when deciding what is correct.
- Solve each question yourself, carefully, and double-check your answer.
For each question give: n (its number as printed, e.g. "1" or "4b"), prompt (the question restated in plain-text math with Unicode, e.g. x², √, ≤), concept (the specific skill, e.g. "Solving two-step equations", "Proof by contrapositive"), standard (the single most specific Common Core State Standard for Mathematics code, e.g. "7.EE.B.4", "HSA-APR.D.6"; use "MP3" for a proof or argument item with no better content standard), standard_desc (a short plain-language statement of that standard), points (as printed; if not printed, 1 point per essential step, usually 1–4), answer (the correct final answer plus the key steps that earn credit; for proofs, the required steps with points for each).

Reply with ONLY JSON: {"title":"","course":"","questions":[{"n":"1","prompt":"","concept":"","standard":"","standard_desc":"","points":2,"answer":""}]}`,{images:imgs,modelTier:"complex",signal,cache:false});
    if(!Array.isArray(r&&r.questions)||!r.questions.length)return {ok:false};
    a.questions=r.questions.map((q,i)=>({n:String(q.n||i+1),prompt:String(q.prompt||""),concept:String(q.concept||""),standard:String(q.standard||""),standardDesc:String(q.standard_desc||""),points:num(q.points,1)||1,answer:String(q.answer||"")}));
    if(r.title&&(!a.title||a.title==="Untitled assessment"))a.title=String(r.title);
    if(r.course&&!a.course)a.course=String(r.course);
    a.keyAuto=true;saveKeySoon();return {ok:true};
  }catch(e){return {ok:false,code:e&&e.code}}
}

function md(t){const out=[];let ul=false;for(const raw of String(t||"").split("\n")){const l=raw.trim();const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  if(/^#{2,4}\s/.test(l)){if(ul){out.push("</ul>");ul=false}out.push("<h4>"+inl(l.replace(/^#+\s/,""))+"</h4>")}
  else if(/^[-*]\s/.test(l)){if(!ul){out.push("<ul>");ul=true}out.push("<li>"+inl(l.slice(2))+"</li>")}
  else if(l){if(ul){out.push("</ul>");ul=false}out.push("<p>"+inl(l)+"</p>")}}
  if(ul)out.push("</ul>");return out.join("")}

function gapContext(a){
  if(!a||!a.students.length)return "";
  const {qs}=classStats(a);const weak=qs.filter(x=>x.f<.8);if(!weak.length)return "";
  return "THIS CLASS'S GAPS (from "+a.title+"):\n"+weak.map(x=>{const errs=x.its.filter(i=>i.earned<i.max&&i.error_step).slice(0,4).map(i=>"   - "+i.error_step).join("\n");
    return `Q${x.q.n} ${x.q.concept}${x.q.standard?" ("+x.q.standard+")":""}: ${pct(x.f,1)}% earned. Typical errors:\n${errs}`}).join("\n");
}

      if(!Array.isArray(data&&data.criteria)||!data.criteria.length)throw {code:"invalid_json"};
    }else{

function classStats(a){
  const qs=a.questions.map(q=>{const its=a.students.map(s=>s.items.find(i=>i.q===q.n)).filter(Boolean);const e=its.reduce((x,i)=>x+i.earned,0),m=its.reduce((x,i)=>x+i.max,0);return {q,f:m?e/m:0,its}});
  const concepts={};for(const x of qs){const k=x.q.concept||"Q"+x.q.n;concepts[k]=concepts[k]||{e:0,m:0,qs:[]};concepts[k].qs.push(x.q.n);for(const i of x.its){concepts[k].e+=i.earned;concepts[k].m+=i.max}}
  const stds={};for(const x of qs){if(!x.q.standard)continue;const k=x.q.standard;stds[k]=stds[k]||{e:0,m:0,qs:[],desc:x.q.standardDesc||""};stds[k].qs.push(x.q.n);for(const i of x.its){stds[k].e+=i.earned;stds[k].m+=i.max}}
  const types={};for(const s of a.students)for(const i of s.items)if(i.earned<i.max){types[i.error_type]=(types[i.error_type]||0)+1}
  return {qs,concepts,types,stds};

/* ---------- Toddle gradebook (only when opened from Toddle on the hosted version) ---------- */
function tdNorm(x){return String(x||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z ]+/g," ").trim().split(/\s+/).filter(Boolean)}
function tdMatch(a){const R=S.toddle.roster||[];const used=new Set(a.students.map(s=>s.toddleId).filter(Boolean));
  const firstCount={};for(const r of R){const f=tdNorm(r.given||r.name)[0];if(f)firstCount[f]=(firstCount[f]||0)+1}
  let n=0;for(const s of a.students){if(s.toddleId&&R.some(r=>r.id===s.toddleId))continue;const t=tdNorm(s.name);if(!t.length)continue;
    let best=null,bs=0,tie=false;
    for(const r of R){if(used.has(r.id))continue;const rn=tdNorm(r.name),rf=tdNorm(r.given)[0]||rn[0],rl=tdNorm(r.family).slice(-1)[0]||rn.slice(-1)[0];let sc=0;
      if(t.join(" ")===rn.join(" "))sc=3;else if(t[0]===rf&&t.length>1&&rl&&t[t.length-1][0]===rl[0])sc=2.5;else if(t[0]===rf&&firstCount[rf]===1)sc=1.5;
      if(sc>bs){bs=sc;best=r;tie=false}else if(sc&&sc===bs)tie=true}
    if(best&&!tie){s.toddleId=best.id;used.add(best.id);saveStudentSoon(s);n++}}
  return n}
async function tdLoadRoster(){const a=S.cur;S.toddle.busy=true;S.toddle.msg="";render();
  try{const r=await window.proofmarkLti.roster();S.toddle.roster=r.students||[];const n=tdMatch(a);S.toddle.msg=`Loaded ${S.toddle.roster.length} students from Toddle and matched ${n} automatically. Check the matches below.`}
  catch(e){S.toddle.msg=e.message||"Couldn't load the class list."}
  S.toddle.busy=false;render()}
function tdComment(s){const f=s.feedback||{};return [f.glow,f.grow?"Next focus: "+f.grow:"",(f.next_steps||[]).length?"Next steps: "+f.next_steps.join("; "):"",f.hint?"Try this: "+f.hint:""].filter(Boolean).join("\n")}
async function tdSend(){const a=S.cur;const ready=a.students.filter(s=>s.toddleId);if(!ready.length)return;S.toddle.busy=true;S.toddle.msg="";render();
  try{const r=await window.proofmarkLti.sendScores({label:a.title,resourceId:"proofmark-"+a.id,scoreMaximum:maxPts(a),scores:ready.map(s=>({userId:s.toddleId,scoreGiven:total(s),comment:S.toddle.withFeedback?tdComment(s):""}))});
    const ok=r.results.filter(x=>x.ok).length;S.toddle.results=Object.fromEntries(r.results.map(x=>[x.userId,x]));
    for(const s of ready){const x=S.toddle.results[s.toddleId];if(x&&x.ok){s.toddleSentAt=Date.now();saveStudentSoon(s)}}
    S.toddle.msg=`Sent ${ok} of ${ready.length} scores to the Toddle gradebook${ok<ready.length?". Some failed; see below.":"."}`}
  catch(e){S.toddle.msg=e.message||"Couldn't send scores."}
  S.toddle.busy=false;render()}

     <td>${s.toddleId&&counts[s.toddleId]>1?'<span class="pill bad">Matched twice</span>':x?(x.ok?'<span class="pill good">Sent</span>':`<span class="pill bad" title="${esc(x.message||"")}">Failed</span>`):s.toddleSentAt?'<span class="pill">Sent before</span>':""}</td></tr>`}).join("")}
   </tbody></table></div>

  </div>`;
}

function feedbackText(s,a){const f=s.feedback||{},o=S.copy;const L=[];

document.addEventListener("click",e=>{

  else if(act==="delq"){a.questions.splice(+b.dataset.i,1);saveKeySoon();render()}

    const id=a.id;const sids=a.students.map(s=>s.id);S.list=S.list.filter(x=>x.id!==id);S.cur=S.list[0]||DEMO;S.confirmDel=false;

  else if(act==="fb1")exportFeedback(true);
  else if(act==="copyone"){const s=a.students.find(x=>x.id===S.sel);if(s)copyText(feedbackText(s,a),"Copied feedback for "+s.name)}
  else if(act==="copynext"){const list=[...a.students].sort((x,y)=>x.name.localeCompare(y.name));const i=list.findIndex(x=>x.id===S.sel);const s=list[i];
    if(s)copyText(feedbackText(s,a),"Copied "+s.name+(list[i+1]?". Next: "+list[i+1].name:". That was the last student."));
    if(list[i+1]){S.sel=list[i+1].id;render();window.scrollTo(0,0)}}
  else if(act==="copyall"){const list=[...a.students].sort((x,y)=>x.name.localeCompare(y.name));copyText(list.map(s=>feedbackText(s,a)).join("\n\n----------\n\n"),"Copied feedback for "+list.length+" students")}
  else if(act==="fb0")exportFeedback(false);
});
$("#picker").addEventListener("change",e=>{S.confirmDel=false;const id=e.target.value;if(id==="__demo"){S.cur=DEMO;S.tab="insights";render()}else{S.tab=S.tab;openAssessment(id)}});
const studentSaveTimers={};
function saveStudentSoon(s){clearTimeout(studentSaveTimers[s.id]);studentSaveTimers[s.id]=setTimeout(()=>saveStudent(s),700)}
document.addEventListener("input",e=>{const el=e.target;const a=S.cur;
  if(el.id==="gen-topic"){S.gen.topic=el.value;return}if(el.id==="gen-course"){S.gen.course=el.value;return}if(el.id==="gen-count"){S.gen.count=num(el.value,8);return}
  if(!a||a.demo)return;
  if(el.id==="k-title"){a.title=el.value;saveKeySoon()}
  else if(el.id==="k-course"){a.course=el.value;saveKeySoon()}
  else if(el.id==="k-guidance"){a.guidance=el.value;saveKeySoon()}
  else if(el.dataset.qf){const q=a.questions[+el.closest("tr").dataset.qi];q[el.dataset.qf]=el.dataset.qf==="points"?num(el.value):el.value;saveKeySoon()}
  else if(el.id==="s-name"){const s=a.students.find(x=>x.id===S.sel);s.name=el.value;saveStudentSoon(s)}
  else if(el.dataset.if){const s=a.students.find(x=>x.id===S.sel);const it=s.items[+el.dataset.ii];
    if(el.dataset.if==="earned"){it.earned=Math.max(0,Math.min(it.max,num(el.value)));it.teacherEdited=true}else it.comment=el.value;saveStudentSoon(s)}
  else if(el.dataset.fb){const s=a.students.find(x=>x.id===S.sel);s.feedback[el.dataset.fb]=el.dataset.fb==="next_steps"?el.value.split("\n").map(x=>x.trim()).filter(Boolean):el.value;saveStudentSoon(s)}
});
document.addEventListener("change",e=>{const el=e.target;const a=S.cur;
  if(el.id==="k-level"&&a&&!a.demo){a.level=el.value;saveKeySoon()}
  else if(el.id==="gen-diff"){S.gen.difficulty=el.value}
  else if(el.id==="gen-gaps"){S.gen.fromGaps=el.checked}
  else if(el.id==="td-fb"){S.toddle.withFeedback=el.checked}
  else if(el.id==="cp-score"){S.copy.score=el.checked}
  else if(el.id==="cp-items"){S.copy.items=el.checked}
  else if(el.dataset.tdSid&&a&&!a.demo){const s=a.students.find(x=>x.id===el.dataset.tdSid);if(s){s.toddleId=el.value||null;S.toddle.results=null;saveStudentSoon(s);render()}}
  else if(el.id==="g-per"){S.perStudent=+el.value;renderGroups();renderProgress()}
  else if(el.id==="g-detail"){S.detail=el.value==="1"}
  else if(el.id==="g-tier"){S.tier=el.value}
  else if(el.id==="workfiles"){addFiles(el.files);el.value=""}
  else if(el.dataset.if==="earned"||el.id==="s-name"){render()}
});
document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.remove("over");addFiles(e.dataTransfer.files)}});
const _render=render;render=function(){_render();if(S.tab==="grade"){renderProgress();renderGroups()}};

/* ---------- boot ---------- */
S.cur=DEMO;render();
if(window.proofmarkLti)window.proofmarkLti.context().then(c=>{S.toddle.ctx=c;render()}).catch(()=>{});
(async()=>{
  const C=window.claude;if(!C||!C.use){S.dbStatus="off";render();return}
  const [user,db,sample,downloads]=await Promise.all(["user","db","sample","downloads"].map(n=>C.use(n).catch(()=>null)));
  S.sample=sample;S.downloads=downloads;S.db=db;
  if(sample){try{const l=await sample.limits();S.imgLimits=l.images||{maxCount:0}}catch(e){S.imgLimits={maxCount:0}}}
  if(user&&db){try{S.uid=await user.id()}catch(e){}}
  await loadList();
})();
</script>
